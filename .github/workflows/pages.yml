name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/tradable-cards-portfolio-serol0
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement turns Pages on for the repo if it has not been set up yet.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # The site is static files at the repo root, so there is nothing to build.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
